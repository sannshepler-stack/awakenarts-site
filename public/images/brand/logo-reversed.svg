<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 350">
  <!-- AwakenArts monogram — Variant: Reversed / mark-only (transparent background)
       Gold "A" monogram (script "a" + block "A" + leaf sprig), no wordmark —
       used at small inline sizes (footer, secondary-page footers) where a full
       wordmark would be illegible. The visible "© AwakenArts" text elsewhere
       in these footers carries the wordmark at those sizes. For use on dark/navy
       backgrounds. Replaces the retired double-arc mark (archived in old-logo/). -->
  <g id="mark">
    <text x="167" y="288" text-anchor="middle"
      font-family="'Cormorant Garamond','TeX Gyre Bonum',Georgia,serif" font-style="italic" font-weight="400"
      font-size="150" fill="#8B6914" opacity="0.95" transform="rotate(-4 167 288)">a</text>
    <text x="263" y="300" text-anchor="middle"
      font-family="'Cormorant Garamond','TeX Gyre Bonum',Georgia,serif" font-weight="700"
      font-size="250" fill="#C9A84C">A</text>
    <g>
      <path d="M273,100 C287,78 305,58 327,36" stroke="#8B6914" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M277,95 C270,83 273,68 288,58 C296,71 293,86 277,95 Z" fill="#B8923E" stroke="#8B6914" stroke-width="1"/>
      <path d="M293,76 C288,61 294,46 310,38 C316,52 311,66 293,76 Z" fill="#B8923E" stroke="#8B6914" stroke-width="1"/>
      <path d="M310,56 C307,41 315,27 331,20 C336,35 329,49 310,56 Z" fill="#B8923E" stroke="#8B6914" stroke-width="1"/>
    </g>
  </g>
</svg>
