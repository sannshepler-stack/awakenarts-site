<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 420">
  <!-- AwakenArts monogram — Primary Logo (mark + wordmark, transparent
       background). Refined per the "AwakenArts Logo Refinement
       Directive": single unified warm-gold (#C8A24A) mark — script "a"
       flourish overlapping the block "A", botanical branch growing
       from the A's right stroke (not floating above it) — with the
       navy (#0F2340) wordmark below. -->
  <g id="mark" fill="#C8A24A">
    <text x="185" y="288" text-anchor="middle"
      font-family="'Cormorant Garamond','TeX Gyre Bonum',Georgia,serif" font-style="italic" font-weight="400"
      font-size="160" transform="rotate(-5 185 288)">a</text>
    <text x="263" y="300" text-anchor="middle"
      font-family="'Cormorant Garamond','TeX Gyre Bonum',Georgia,serif" font-weight="700"
      font-size="250">A</text>
    <g>
      <path d="M270,138 C286,112 308,86 334,54" stroke="#C8A24A" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M276,128 C267,116 270,100 286,90 C296,104 292,120 276,128 Z"/>
      <path d="M294,104 C287,90 292,74 309,64 C317,78 313,94 294,104 Z"/>
      <path d="M313,80 C308,65 315,50 332,42 C339,57 333,72 313,80 Z"/>
      <path d="M330,58 C327,46 333,35 346,30 C350,42 345,53 330,58 Z"/>
    </g>
  </g>
  <text x="230" y="395" text-anchor="middle"
    font-family="'Cormorant Garamond','TeX Gyre Bonum',Georgia,serif" font-weight="500" font-size="38"
    letter-spacing="5" fill="#0F2340">AWAKEN ARTS</text>
</svg>
